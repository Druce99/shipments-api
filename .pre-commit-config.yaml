# Local hooks: tools run from the project's Poetry venv,
# so versions come from poetry.lock and mypy sees the project's dependencies.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: poetry run bandit -q -c pyproject.toml -r src
        language: system
        types: [python]
        pass_filenames: false
